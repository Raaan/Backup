name: publish-release
on:
  workflow_run:
    workflows: [validate]
    types: [completed]
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      startsWith(github.event.workflow_run.head_commit.message, '[release] v0.1.0')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const tag = 'v0.1.0';
            try {
              await github.rest.repos.getReleaseByTag({ ...repo, tag });
              core.info('Release already exists; leaving it unchanged.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const sha = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.repos.getContent({
              ...repo, path: 'RELEASE_NOTES.md', ref: sha
            });
            if (Array.isArray(data) || !data.content) throw new Error('Missing release notes');
            const body = Buffer.from(data.content, 'base64').toString('utf8');
            const release = await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: sha,
              name: 'v0.1.0 — Personal backup edition', body,
              draft: false, prerelease: false
            });
            core.info(release.data.html_url);
